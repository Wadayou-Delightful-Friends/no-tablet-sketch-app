<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>無限キャンバス デモ</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      #toolbar {
        padding: 8px 12px;
        background: #f0f0f0;
        font-size: 14px;
      }
      #sketch-canvas {
        display: block;
        touch-action: none; /* ブラウザ既定のパン・ズームを止めて pointer イベントに割り当てる */
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      ドラッグ: 描く ／ Space+ドラッグ or 中ボタンドラッグ: 移動 ／ ホイール: 拡大縮小
      <span id="status-label" style="margin-left: 16px; color: #666;"></span>
    </div>
    <canvas id="sketch-canvas" width="1200" height="800"></canvas>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
